<!DOCTYPE html>
<html>
<head>
  <title>SusGPT 😈</title>
  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #chat {
      width: 300px;
      height: 300px;
      background: #1e293b;
      padding: 10px;
      overflow-y: auto;
      border-radius: 10px;
    }
    input {
      width: 220px;
      padding: 8px;
      margin-top: 10px;
    }
    button {
      padding: 8px;
    }
  </style>
</head>
<body>

<h2>SusGPT 😈</h2>
<p style="font-size:12px;color:gray;">Parody AI – not real ChatGPT</p>

<div id="chat"></div>

<input id="userInput" placeholder="Say something..." />
<button onclick="send()">Send</button>

<script>
function send() {
  let input = document.getElementById("userInput").value;
  let chat = document.getElementById("chat");

  chat.innerHTML += "<p><b>You:</b> " + input + "</p>";

  let replies = [
    "Bro really said: " + input + " 💀",
    "I refuse 😤",
    "Skill issue detected",
    "W or L chat?",
    "I'm calling your mom ☎️",
    "That made no sense but ok 👍"
  ];

  let reply = replies[Math.floor(Math.random() * replies.length)];

  setTimeout(() => {
    chat.innerHTML += "<p><b>SusGPT:</b> " + reply + "</p>";
    chat.scrollTop = chat.scrollHeight;
  }, 500);
}
</script>

</body>
</html>
